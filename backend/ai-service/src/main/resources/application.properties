spring.application.name=ai-service
# Server
server.port=8083

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/ai_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mySql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Spring AI - Ollama configuration
spring.ai.provider=ollama
spring.ai.ollama.url=http://localhost:11434
spring.ai.ollama.model=mistral
