spring.application.name=api-gateway
server.port=9090

# Eureka Discovery Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Enable Discovery Locator (as a backup)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# --- CUSTOM ROUTES ---

# 1. Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# 2. User Service Route
spring.cloud.gateway.routes[1].id=user-service-route
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/user/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# 3. Trip Service Route
spring.cloud.gateway.routes[2].id=trip-service-route
spring.cloud.gateway.routes[2].uri=lb://trip-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/trip/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

#4 AI Service
spring.cloud.gateway.routes[3].id=ai-service-route
spring.cloud.gateway.routes[3].uri=lb://ai-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/ai/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

#5 Notification Service
spring.cloud.gateway.routes[4].id=notification-service-route
spring.cloud.gateway.routes[4].uri=lb://notification-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/notification/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# GLOBAL CORS CONFIG
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true