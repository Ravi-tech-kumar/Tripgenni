spring.application.name=user-service
# Server Port
server.port=8082

# ---------------------------------------------------------
# MySQL Database Configuration
# ---------------------------------------------------------
# Added createDatabaseIfNotExist=true to handle missing user_db
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
  #spring.datasource.url=jdbc:mysql://localhost:3306/your_db_name?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=****
spring.datasource.password=*****
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# JPA / Hibernate Configuration
# ---------------------------------------------------------
# update: Creates tables if missing, adds columns if Java code changes, keeps data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use the general MySQLDialect (replaces the deprecated MySQL8Dialect)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------
# Feign Client / Service Discovery
# ---------------------------------------------------------
auth.service.url=http://localhost:8085

# Instance Configuration
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------------------------------------------------------
# Logging
# ---------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.level.com.tripplanner=DEBUG

