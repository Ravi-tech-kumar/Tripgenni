spring.application.name=trip-service
# ----------------------
# Common Settings
# ----------------------
server.port=8083

# ----------------------
# MySQL Database (Docker)
# ----------------------
# FIX: Added 'createDatabaseIfNotExist=true' to handle missing DBs
spring.datasource.url=jdbc:mysql://localhost:3306/trip_db?createDatabaseIfNotExist=true
spring.datasource.username=*****
spring.datasource.password=*****
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# FIX: Changed Dialect to the modern version to avoid your log warnings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# OPTIONS:
# Use 'update' to keep data but add new columns/tables.
# Use 'create' if you want to wipe and restart the DB every time you run.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ----------------------
# Eureka Client
# ----------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ----------------------
# Profiles & Config
# ----------------------
spring.cloud.config.enabled=false

# Instance Configuration
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ----------------------
# Security / JWT
# ----------------------
jwt.secret=myVerySecretKey12345678901234567890
jwt.expiration=3600000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration



