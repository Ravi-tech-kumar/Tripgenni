# Application Name
spring.application.name=notification-service

# Server Configuration - Remove context path for consistency
server.port=8084
# Remove this line: server.servlet.context-path=/api/notification

# ==============================================
# DATABASE CONFIGURATION
# ==============================================
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=mySql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000

# ==============================================
# JPA / HIBERNATE CONFIGURATION
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.database=mysql
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ==============================================
# MAIL CONFIGURATION
# ==============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================
# RABBITMQ CONFIGURATION
# ==============================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=5000

rabbitmq.queue.notification=notification.queue
rabbitmq.queue.dead-letter=notification.dead.queue
rabbitmq.exchange.notification=notification.exchange
rabbitmq.exchange.dead-letter=notification.dead.exchange
rabbitmq.routingkey.notification=notification.routingkey

# ==============================================
# EUREKA / SERVICE DISCOVERY CONFIGURATION
# ==============================================
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.hostname=${HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ==============================================
# APPLICATION PROPERTIES
# ==============================================
app.name=TripGennie
app.support-email=support@tripgennie.com
app.base-url=http://localhost:8080

# ==============================================
# LOGGING CONFIGURATION
# ==============================================
logging.level.com.major.notification_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==============================================
# ACTUATOR / MANAGEMENT CONFIGURATION
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.boot.admin.client.enabled=false

# ==============================================
# SWAGGER / OPENAPI CONFIGURATION
# ==============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true